[package]
name = "benches"
version = "0.0.0"
edition.workspace = true
publish = false

[features]
default = []
small = []
big = []

[dependencies]
meon.workspace = true
meon-md.workspace = true
meon-json.workspace = true
criterion = { version = "0.8", features = ["html_reports"] }

[dev-dependencies]
pulldown-cmark = { version = "0.13.6", default-features = false }
comrak = { version = "0.52.0", default-features = false }
simd-json = "0.19.0"
sonic-rs = "0.5.8"

[[bench]]
name = "meon-md_parse"
harness = false

[[bench]]
name = "meon-md_standalone"
harness = false

[[bench]]
name = "meon-md_compare"
harness = false

[[bench]]
name = "meon-json_parse"
harness = false

[[bench]]
name = "meon-json_standalone"
harness = false

[[bench]]
name = "meon-json_compare"
harness = false

[[bench]]
name = "meon-md_offsets"
harness = false

[[bench]]
name = "meon-json_offsets"
harness = false
